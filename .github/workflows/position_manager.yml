name: Long-Term Position Manager

on:
  schedule:
    - cron: "0 15 * * 1"
    # Weekly, Monday ~10am ET (ignores DST, same as the other workflows)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: position-manager
  cancel-in-progress: false

jobs:
  run-position-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run long-term position manager
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING_APPROVED: ${{ secrets.LIVE_TRADING_APPROVED }}
        run: python position_manager.py
