name: Trading Bot

on:
  schedule:
    - cron: "*/15 13-20 * * 1,3,5"
    # Every 15 min, market hours only, Mon/Wed/Fri (paper-trade testing)
  workflow_dispatch:

permissions:
  contents: read

# Never let two bot runs overlap (a slow run must not double-fire entries);
# a queued run waits rather than being cancelled.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING_APPROVED: ${{ secrets.LIVE_TRADING_APPROVED }}
        run: python bot.py
