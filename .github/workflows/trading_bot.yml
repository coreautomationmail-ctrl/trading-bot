name: Trading Bot

on:
  schedule:
    # GitHub drops most "*/15" schedule triggers under load (the 2026-09-14
    # week fired 2-3 of 32 runs/day, never inside the 9:45-10:15 ET entry
    # window). Instead, two long-running jobs per day (Mon/Wed/Fri) each loop
    # bot.py on 15-minute boundaries: morning session then afternoon session
    # (a single job would exceed the 6h hosted-runner limit). Times are UTC;
    # the loop tolerates DST shifts because bot.py itself checks the clock.
    # These still fired 4-5h late (week of 2026-09-21), so the primary trigger
    # is an external cron (cron-job.org, America/New_York) POSTing
    # workflow_dispatch at 9:25 and 12:45 ET; these stay as a late fallback
    # so the 15:45 flatten still runs if the external trigger fails.
    - cron: "40 13 * * 1,3,5"
    - cron: "50 16 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read

# Never let two bot runs overlap (a slow run must not double-fire entries);
# a queued run waits rather than being cancelled.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING_APPROVED: ${{ secrets.LIVE_TRADING_APPROVED }}
        run: |
          # Session end (UTC): the morning job hands off at 16:50Z, the
          # afternoon job runs past the latest possible close+flatten
          # (21:00Z in winter). Each pass is ~20s; idle passes exit at once.
          now=$(date -u +%s)
          if [ "$(date -u +%H)" -lt 16 ]; then
            end=$(date -u -d "today 16:50" +%s)
          else
            end=$(date -u -d "today 21:10" +%s)
          fi
          python bot.py || echo "[runner] bot.py exited with $?"
          while [ "$(date -u +%s)" -lt "$end" ]; do
            sleep $(( 900 - $(date -u +%s) % 900 ))   # align to :00/:15/:30/:45
            python bot.py || echo "[runner] bot.py exited with $?"
          done
